    // ============================================================
    // 全局状态
    // ============================================================
    let mapChart = null;
    let weatherData = null;
    // Cloudflare Worker 代理地址（部署后替换为你的 Worker URL）
    const PROXY_URL = 'weather-proxy.caotianchong.workers.dev';

    // ============================================================
    // 工具函数
    // ============================================================
    function $(id) { return document.getElementById(id); }

    // 降雨量颜色映射
    function getRainColor(mm) {
        if (mm <= 0) return '#475569';
        if (mm < 10) return '#fbbf24';
        if (mm < 25) return '#3b82f6';
        if (mm < 50) return '#8b5cf6';
        if (mm < 100) return '#ef4444';
        return '#991b1b';
    }

    function getRainLevel(mm) {
        if (mm <= 0) return '无雨';
        if (mm < 10) return '小雨';
        if (mm < 25) return '中雨';
        if (mm < 50) return '大雨';
        if (mm < 100) return '暴雨';
        return '大暴雨';
    }

    // ============================================================
    // 通过 Cloudflare Worker 代理获取天气数据
    // ============================================================
    async function fetchAllWeatherData() {
        const results = [];
        const total = CITIES.length;
        const batchSize = 5;

        for (let i = 0; i < total; i += batchSize) {
            const batch = CITIES.slice(i, i + batchSize);
            
            const promises = batch.map(async (city) => {
                try {
                    const url = `${PROXY_URL}?location=${city.lng},${city.lat}`;
                    const resp = await fetch(url);
                    if (!resp.ok) return null;
                    const data = await resp.json();
                    
                    if (data.code === '200' && data.daily) {
                        return {
                            name: city.name,
                            lng: city.lng,
                            lat: city.lat,
                            region: city.region,
                            rain: parseFloat(data.daily[0].precip) || 0,
                            textDay: data.daily[0].textDay,
                            textNight: data.daily[0].textNight,
                            tempMax: data.daily[0].tempMax,
                            tempMin: data.daily[0].tempMin,
                        };
                    }
                } catch (e) {
                    console.warn(`获取 ${city.name} 数据失败:`, e);
                }
                return null;
            });

            const batchResults = await Promise.all(promises);
            batchResults.forEach(r => { if (r) results.push(r); });

            if (i + batchSize < total) {
                await new Promise(resolve => setTimeout(resolve, 200));
            }
        }

        return results;
    }

    // ============================================================
    // 演示数据生成
    // ============================================================
    function generateDemoData() {
        const results = [];
        
        const rainPattern = {
            south: [20, 80],
            central: [5, 30],
            east: [10, 50],
            north: [0, 15],
            northeast: [0, 10],
            west: [5, 40],
            northwest: [0, 10],
        };

        CITIES.forEach(city => {
            const range = rainPattern[city.region] || [0, 10];
            const rain = Math.round(range[0] + Math.random() * (range[1] - range[0]));
            const texts = rain === 0 ? ['晴', '多云'] : rain < 10 ? ['小雨', '阴'] : rain < 25 ? ['中雨', '小雨'] : rain < 50 ? ['大雨', '中雨'] : ['暴雨', '大雨'];
            
            results.push({
                name: city.name,
                lng: city.lng,
                lat: city.lat,
                region: city.region,
                rain: rain,
                textDay: texts[0],
                textNight: texts[1],
                tempMax: Math.round(20 + Math.random() * 15),
                tempMin: Math.round(15 + Math.random() * 10),
            });
        });

        return results;
    }

    // ============================================================
    // ECharts 可视化
    // ============================================================
    function initMapChart() {
        if (mapChart) mapChart.dispose();
        mapChart = echarts.init($('map-container'));
    }

    function renderMap() {
        if (!mapChart || !weatherData) return;

        const mapData = weatherData.map(city => ({
            name: city.name,
            value: [city.lng, city.lat, city.rain],
            rain: city.rain,
            text: city.textDay,
            region: city.region,
        }));

        const option = {
            backgroundColor: '#0b0f19',
            tooltip: {
                trigger: 'item',
                backgroundColor: 'rgba(21, 26, 40, 0.95)',
                borderColor: '#3b82f6',
                textStyle: { color: '#e2e8f0' },
                formatter: function(params) {
                    if (params.data) {
                        return `<div style="padding: 8px;">
                            <b style="font-size: 14px;">${params.data.name}</b><br/>
                            <span style="color: #94a3b8;">降雨量:</span> ${params.data.rain} mm<br/>
                            <span style="color: #94a3b8;">等级:</span> <span style="color: ${getRainColor(params.data.rain)}">${getRainLevel(params.data.rain)}</span><br/>
                            <span style="color: #94a3b8;">天气:</span> ${params.data.text}
                        </div>`;
                    }
                    return params.name;
                }
            },
            visualMap: {
                show: false,
                min: 0,
                max: 100,
                inRange: {
                    color: ['#475569', '#fbbf24', '#3b82f6', '#8b5cf6', '#ef4444', '#991b1b']
                }
            },
            geo: {
                map: 'china',
                roam: true,
                zoom: 1.2,
                label: { show: false },
                itemStyle: {
                    areaColor: '#1e293b',
                    borderColor: '#3b82f6',
                    borderWidth: 0.5
                },
                emphasis: {
                    itemStyle: { areaColor: '#2563eb' }
                }
            },
            series: [
                {
                    name: '降雨量',
                    type: 'scatter',
                    coordinateSystem: 'geo',
                    data: mapData,
                    symbolSize: function(val) {
                        const rain = val[2];
                        if (rain <= 0) return 5;
                        return Math.max(6, Math.min(28, 5 + Math.sqrt(rain) * 2.2));
                    },
                    itemStyle: {
                        color: function(params) {
                            return getRainColor(params.data.rain);
                        },
                        shadowBlur: 8,
                        shadowColor: function(params) {
                            return getRainColor(params.data.rain);
                        }
                    },
                    label: {
                        show: true,
                        formatter: '{b}',
                        position: 'right',
                        color: '#e2e8f0',
                        fontSize: 9,
                        distance: 2
                    },
                    emphasis: {
                        label: { show: true, fontSize: 12 },
                        itemStyle: { shadowBlur: 15 }
                    }
                }
            ]
        };

        mapChart.setOption(option, true);
        updateDashboard();
    }

    function updateDashboard() {
        if (!weatherData) return;

        const rains = weatherData.map(c => c.rain);
        const maxRain = Math.max(...rains);
        const avgRain = (rains.reduce((a, b) => a + b, 0) / rains.length).toFixed(1);
        const rainyCities = rains.filter(r => r > 0).length;
        const heavyCities = rains.filter(r => r >= 50).length;
        const maxCity = weatherData.find(c => c.rain === maxRain);

        $('stat-max').textContent = `${maxRain}mm (${maxCity ? maxCity.name : '-'})`;
        $('stat-avg').textContent = `${avgRain}mm`;
        $('stat-rainy').textContent = `${rainyCities} / ${weatherData.length}`;
        $('stat-heavy').textContent = `${heavyCities} 个`;
        $('info-cities').textContent = weatherData.length;
        $('info-time').textContent = new Date().toLocaleString('zh-CN');

        // 排行
        const sorted = [...weatherData].sort((a, b) => b.rain - a.rain).slice(0, 15);
        $('rain-ranking').innerHTML = sorted.map((city, i) => {
            const color = getRainColor(city.rain);
            const rankColor = i < 3 ? 'text-yellow-400' : 'text-gray-400';
            return `<div class="flex items-center gap-2 py-1 hover:bg-dark/50 rounded px-1">
                <span class="${rankColor} font-bold w-5 text-center">${i + 1}</span>
                <span class="flex-1">${city.name}</span>
                <span class="px-2 py-0.5 rounded text-xs" style="background:${color}20;color:${color}">${city.rain}mm</span>
            </div>`;
        }).join('');

        // 预警
        const warnings = weatherData.filter(c => c.rain >= 50);
        if (warnings.length > 0) {
            $('warning-list').innerHTML = warnings.map(c => 
                `<div class="flex items-center gap-2 p-1 bg-red-900/20 rounded">
                    <span class="text-red-400">⚠️</span>
                    <span>${c.name}: ${c.rain}mm (${c.textDay})</span>
                </div>`
            ).join('');
        } else {
            $('warning-list').innerHTML = '<div class="text-gray-500 text-center py-2">✅ 暂无暴雨预警</div>';
        }

        // 区域统计
        const regions = ['south', 'east', 'central', 'north', 'west', 'northwest', 'northeast'];
        const regionNames = { south: '华南', east: '华东', central: '华中', north: '华北', west: '西南', northwest: '西北', northeast: '东北' };
        
        regions.forEach(r => {
            const cities = weatherData.filter(c => c.region === r);
            if (cities.length > 0) {
                const avg = (cities.reduce((a, b) => a + b.rain, 0) / cities.length).toFixed(1);
                const max = Math.max(...cities.map(c => c.rain));
                $(`region-${r}`).textContent = `平均 ${avg}mm / 最大 ${max}mm`;
            }
        });
    }

    // ============================================================
    // 地图加载
    // ============================================================
    async function loadChinaMap() {
        try {
            const resp = await fetch('https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json');
            if (!resp.ok) throw new Error('地图数据加载失败');
            const geoJSON = await resp.json();
            echarts.registerMap('china', geoJSON);
            return true;
        } catch (e) {
            console.error('地图加载失败:', e);
            return false;
        }
    }

    // ============================================================
    // 初始化
    // ============================================================
    async function init() {
        const mapLoaded = await loadChinaMap();
        if (!mapLoaded) {
            alert('中国地图数据加载失败，请检查网络连接后刷新页面');
            return;
        }

        initMapChart();

        // 默认加载演示数据
        weatherData = generateDemoData();
        $('info-source').textContent = '演示数据 (模拟)';
        $('data-time').textContent = '数据时间: 演示模式';
        renderMap();

        // 刷新按钮 - 通过代理获取真实数据
        $('btn-refresh').addEventListener('click', async () => {
            $('btn-refresh').textContent = '加载中...';
            $('btn-refresh').disabled = true;

            try {
                // 测试代理是否可用
                const testUrl = `${PROXY_URL}?location=116.41,39.92`;
                const testResp = await fetch(testUrl);
                const testData = await testResp.json();
                
                if (testData.code !== '200') {
                    alert(`数据获取失败 (错误码: ${testData.code})，请检查代理配置`);
                    return;
                }

                weatherData = await fetchAllWeatherData();
                $('info-source').textContent = '和风天气 (实时)';
                $('data-time').textContent = '数据时间: 实时预报';
                renderMap();
                alert(`成功获取 ${weatherData.length} 个城市数据！`);

            } catch (e) {
                alert('获取数据失败: ' + e.message);
            } finally {
                $('btn-refresh').textContent = '刷新数据';
                $('btn-refresh').disabled = false;
            }
        });

        // 窗口缩放
        window.addEventListener('resize', () => {
            if (mapChart) mapChart.resize();
        });
    }

    // 启动
    init();
    </script>
</body>
